[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # These VITE_* values are public by design (Supabase URL + publishable/anon key,
  # public API base URL) and are intentionally inlined into the client bundle by Vite.
  # Never add server-only secrets (e.g. the Supabase service role key) to this list.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_API_BASE_URL"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.botpress.cloud https://files.bpcontent.cloud https://*.google.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com https://*.supabase.co https://cdn.botpress.cloud https://files.bpcontent.cloud https://i.ytimg.com https://maps.google.com https://www.google.com https://*.google.com https://*.googleapis.com https://*.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.botpress.cloud https://files.bpcontent.cloud https://*.bpcontent.cloud https://*.botpress.cloud wss://*.botpress.cloud https://*.onrender.com https://api.brevo.com https://maps.google.com https://www.google.com https://*.google.com https://*.googleapis.com; media-src 'self' data: blob: https://*.supabase.co; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://cdn.botpress.cloud https://maps.google.com https://www.google.com https://*.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';"
