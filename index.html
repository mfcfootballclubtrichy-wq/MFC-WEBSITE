<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/mfc-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Mutharasanallur Football Club (MFC) — Trichy, Tamil Nadu</title>
    <meta
      name="description"
      content="Official website of Mutharasanallur Football Club (MFC), Trichy. AIFF certified coaches, grassroots player development, and youth tournament honors."
    />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://mfcfootballacademy.com/" />
    <meta property="og:title"       content="MFC Football Academy — Trichy" />
    <meta
      property="og:description"
      content="Professional football training centre in Mutharasanallur, Trichy. AIFF certified coaches, structured age-group programs."
    />
    <!-- og:image: replace with actual club photo [CONFIRM] -->

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="MFC Football Academy — Trichy" />
    <meta
      name="twitter:description"
      content="Grassroots football excellence in Mutharasanallur, Trichy, Tamil Nadu."
    />

    <!-- Security headers are set server-side (Vercel / Nginx config).
         The meta CSP below is a fallback only and NOT a replacement. -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Preconnect to Google Fonts (loaded in index.css) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Theme colour for browser chrome -->
    <meta name="theme-color" content="#0B0B0C" />
  </head>

    <!-- No-JS notice — content is still readable without JavaScript -->

        <a href="mailto:mfcfootballacademy@gmail.com">mfcfootballacademy@gmail.com</a>.
      </p>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
